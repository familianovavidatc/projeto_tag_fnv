<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Igreja Família Nova Vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --preto: #111111;
    --dourado: #C8A04A;
    --branco: #F5F2EA;
    --ambar: #D98A27;
    --linha: rgba(200, 160, 74, .35);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--preto);
    color: var(--branco);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 440px;
    padding: 40px 20px 32px;
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }

  /* Topo */
  header { text-align: center; margin-bottom: 36px; }
  .logo { display: block; width: 100%; max-width: 340px; height: auto; margin: 0 auto 6px; mix-blend-mode: lighten; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .assinatura {
    margin: 10px 0 0;
    color: var(--dourado);
    font-size: 16px;
  }

  /* Botões */
  .lista { display: grid; gap: 12px; }
  .botao {
    display: flex; align-items: center; gap: 14px;
    width: 100%;
    min-height: 60px;
    padding: 14px 18px;
    border: 1.5px solid var(--dourado);
    border-radius: 14px;
    background: transparent;
    color: var(--branco);
    font: inherit;
    font-weight: 600;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .botao svg { flex: none; width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .botao small { display: block; font-weight: 400; font-size: 14px; opacity: .75; }
  .botao:active { background: rgba(200, 160, 74, .14); }
  .botao:focus-visible, .copiar:focus-visible { outline: 3px solid var(--ambar); outline-offset: 3px; }

  .botao.principal { background: var(--dourado); color: var(--preto); border-color: var(--dourado); }
  .botao.principal:active { background: var(--ambar); border-color: var(--ambar); }

  /* Painel do PIX */
  .pix { display: none; margin-top: -2px; padding: 18px; border: 1.5px solid var(--linha); border-radius: 14px; }
  .pix.aberto { display: block; }
  .pix p { margin: 0 0 4px; font-size: 15px; opacity: .8; }
  .chave {
    margin: 0 0 14px;
    font-family: "DM Serif Display", Georgia, serif;
    font-size: 26px;
    letter-spacing: .02em;
    color: var(--dourado);
    word-break: break-all;
  }
  .copiar {
    width: 100%; min-height: 52px;
    border: 0; border-radius: 12px;
    background: var(--branco); color: var(--preto);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .copiar:active { background: var(--dourado); }
  .aviso { min-height: 22px; margin: 10px 0 0; text-align: center; color: var(--dourado); font-size: 15px; }

  footer { margin-top: 36px; text-align: center; font-size: 14px; opacity: .6; }

  @media (prefers-reduced-motion: no-preference) {
    .botao { transition: background-color .15s ease; }
  }
</style>
</head>

  (function () {
    var $ = function (id) { return document.getElementById(id); };

    $("lnkYoutube").href = CONFIG.YOUTUBE;
    $("lnkInstagram").href = CONFIG.INSTAGRAM;

    if (CONFIG.WHATSAPP_NUMERO) {
      $("lnkWhatsapp").href = "https://wa.me/" + CONFIG.WHATSAPP_NUMERO + "?text=" + encodeURIComponent(CONFIG.WHATSAPP_MENSAGEM);

    $("btnPix").addEventListener("click", function () {
      var painel = $("painelPix");

      this.setAttribute("aria-expanded", aberto);
      if (aberto) painel.scrollIntoView({ behavior: "smooth", block: "nearest" });

    $("btnCopiar").addEventListener("click", function () {
      var texto = CONFIG.PIX;
      function fallback() {
        var t = document.createElement("textarea");
        t.value = texto; t.setAttribute("readonly", "");
        t.style.position = "fixed"; t.style.opacity = "0";
        document.body.appendChild(t); t.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(t);
        avisar(ok ? "Chave copiada. Cole no app do seu banco." : "Não foi possível copiar. Digite: " + CONFIG.PIX_EXIBIR);
      }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(texto).then(function () {
          avisar("Chave copiada. Cole no app do seu banco.");
        }, fallback);
      } else { fallback(); }
    });
  })();
